# Netlify build configuration.
#
# Netlify detects Next.js and applies its runtime (OpenNext adapter) automatically,
# which serves the App Router pages, the API routes as functions and middleware.ts at
# the edge. Nothing else needs configuring here.
#
# Environment variables are set in the Netlify UI (Site configuration > Environment
# variables), never in this file. See README.md > Deploying for the list.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Skip the ~150 MB browser download Playwright would otherwise attempt on install.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
